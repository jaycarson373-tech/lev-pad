name: Verify LeverMeme
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  signer-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix services/signer ci --ignore-scripts
      - run: npm --prefix services/signer audit --omit=dev --audit-level=moderate
