[package]
name = "levermeme"
version = "0.1.0"
edition = "2021"
description = "LeverMeme listing burns and segregated collateral custody; trading not implemented"

[lib]
crate-type = ["cdylib", "lib"]
name = "levermeme"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []

[dependencies]
anchor-lang = "=1.1.2"
solana-sha256-hasher = "3.1.0"
switchboard-on-demand = { version = "=0.13.0", default-features = false, features = ["solana-v3"] }
# Switchboard includes optional crypto helpers; random generation is forbidden on SBF.
getrandom = { version = "0.2", features = ["custom"] }
anchor-spl = { version = "=1.1.2", default-features = false, features = ["token", "token_2022", "associated_token"] }

[dev-dependencies]
litesvm = "=0.10.0"
solana-account = "3.2"
solana-address = "2"
solana-message = "3"
solana-transaction = "3"
